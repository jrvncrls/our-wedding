<main class="gallery-page section" aria-label="Photo gallery">
  <div class="container">
    <!-- Page header -->
    <div class="gallery-page__header">
      <span class="eyebrow">Photo Album</span>
      <h1 class="gallery-page__title">Our Gallery</h1>
      <span class="section-rule"></span>
      <p class="gallery-page__subtitle">
        Every moment from our story — prenup, the big day, and all the joy in between.
      </p>
      <div class="gallery-page__header-cta">
        <app-button variant="primary" size="md" (clicked)="openDrive()">
          <i class="uil uil-google-drive"></i>
          View All Photos
        </app-button>
      </div>
    </div>

    <!-- Masonry grid -->
    <div class="gallery-page__grid" aria-label="Photo grid">
      @for (photo of photos; track photo.src; let i = $index) {
        <button
          type="button"
          class="gallery-page__tile"
          #tile
          [style.transition-delay]="(i % 4) * 75 + 'ms'"
          (click)="openLightbox(i)"
          [attr.aria-label]="'View photo: ' + photo.alt"
        >
          <div class="gallery-page__tile-shine"></div>
          <img class="gallery-page__tile-image" [src]="photo.src" [alt]="photo.alt" loading="lazy" />
        </button>
      }
    </div>
  </div>

  <!-- Lightbox -->
  @if (activePhoto(); as photo) {
    <div class="gallery-page__lightbox" (click)="closeLightbox()">
      <button
        type="button"
        class="gallery-page__lightbox-control gallery-page__lightbox-control--close"
        (click)="closeLightbox()"
        aria-label="Close photo viewer"
      >
        <i class="uil uil-times"></i>
      </button>
      <button
        type="button"
        class="gallery-page__lightbox-control gallery-page__lightbox-control--prev"
        (click)="$event.stopPropagation(); prevPhoto()"
        aria-label="Previous photo"
      >
        <i class="uil uil-angle-left"></i>
      </button>
      <img
        class="gallery-page__lightbox-image"
        [src]="photo.src"
        [alt]="photo.alt"
        (click)="$event.stopPropagation()"
      />
      <button
        type="button"
        class="gallery-page__lightbox-control gallery-page__lightbox-control--next"
        (click)="$event.stopPropagation(); nextPhoto()"
        aria-label="Next photo"
      >
        <i class="uil uil-angle-right"></i>
      </button>
    </div>
  }
</main>
